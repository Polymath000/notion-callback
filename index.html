<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion OAuth Callback</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get('code');
  const error = urlParams.get('error');
  const errorDescription = urlParams.get('error_description');
  const state = urlParams.get('state');

  if (code) {
    window.location.href =
      `quicknotion://oauth?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state || '')}`;
  } else if (error) {
    window.location.href =
      `quicknotion://oauth?error=${encodeURIComponent(error)}&error_description=${encodeURIComponent(errorDescription || '')}`;
  } else {
    document.getElementById('message').innerHTML =
      '<p>No authorization code received. Please try again.</p>';
  }
</script>

</head>
<body>
    <div class="container">
        <h1>Notion OAuth</h1>
        <div class="spinner"></div>
        <div id="message">
            <p>Redirecting to QuickNotion...</p>
        </div>
    </div>
</body>
</html>
